<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Device Management | NetMonitor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <div class="logo">
            <h2>NetMonitor</h2>
            <span>NETWORK SYSTEM</span>
        </div>

        <nav>
            <a href="/">Dashboard</a>
            <a href="/devices" class="active">Devices</a>
            <a href="/history">History</a>
        </nav>

        <div class="sidebar-footer">
            <p>Network Monitoring</p>
            <span>Version 1.0</span>
        </div>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Device Management</h1>
                <p>Manage and monitor your network devices</p>
            </div>

            <div class="system-status">
                <span class="status-dot"></span>
                System Online
            </div>
        </header>

        <section class="panel device-form">
            <h2>Add New Device</h2>

            <form id="deviceForm">
                <div class="form-group">
                    <label for="deviceName">Device Name</label>
                    <input
                        type="text"
                        id="deviceName"
                        placeholder="Example: Router"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="ipAddress">IP Address</label>
                    <input
                        type="text"
                        id="ipAddress"
                        placeholder="Example: 192.168.1.1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input
                        type="text"
                        id="description"
                        placeholder="Device description"
                    >
                </div>

                <button type="submit" class="primary-button">
                    Add Device
                </button>
            </form>

            <p id="formMessage"></p>
        </section>

        <section class="panel device-list">
            <div class="section-header">
                <h2>Registered Devices</h2>
                <button onclick="loadDevices()" class="refresh-button">
                    Refresh
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>IP Address</th>
                            <th>Status</th>
                            <th>Latency</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="deviceTable">
                        <tr>
                            <td colspan="6">Loading devices...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <footer>
            Python Network Monitoring Dashboard
        </footer>

    </main>
</div>

<script>
async function loadDevices() {
    const table = document.getElementById("deviceTable");

    try {
        const response = await fetch("/api/devices");

        if (!response.ok) {
            throw new Error("Failed to load devices");
        }

        const devices = await response.json();

        table.innerHTML = "";

        if (devices.length === 0) {
            table.innerHTML = `
                <tr>
                    <td colspan="6">No devices registered.</td>
                </tr>
            `;
            return;
        }

        devices.forEach(device => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${device.id}</td>
                <td>${escapeHTML(device.name)}</td>
                <td>${escapeHTML(device.ip_address)}</td>
                <td id="status-${device.id}">Not checked</td>
                <td id="latency-${device.id}">--</td>
                <td>
                    <button onclick="checkDevice(${device.id})">
                        Check
                    </button>

                    <button onclick="deleteDevice(${device.id})"
                            class="delete-button">
                        Delete
                    </button>
                </td>
            `;

            table.appendChild(row);
        });

    } catch (error) {
        table.innerHTML = `
            <tr>
                <td colspan="6">Unable to load devices.</td>
            </tr>
        `;

        console.error(error);
    }
}

let autoMonitoringInterval = null;

async function autoCheckDevices() {
    try {
        // Get registered devices
        const response = await fetch("/api/devices");

        if (!response.ok) {
            throw new Error("Failed to get devices");
        }

        const devices = await response.json();

        // Check each device automatically
        for (const device of devices) {
            await checkDevice(device.id);
        }

    } catch (error) {
        console.error("Automatic monitoring error:", error);
    }
}

function startAutoMonitoring() {
    // Prevent multiple monitoring intervals
    if (autoMonitoringInterval !== null) {
        return;
    }

    // Check devices every 30 seconds
    autoMonitoringInterval = setInterval(() => {
        autoCheckDevices();
    }, 30000);
}


async function addDevice(event) {
    event.preventDefault();

    const message = document.getElementById("formMessage");

    const device = {
        name: document.getElementById("deviceName").value.trim(),
        ip_address: document.getElementById("ipAddress").value.trim(),
        description: document.getElementById("description").value.trim()
    };

    try {
        const response = await fetch("/api/devices", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(device)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Failed to add device");
        }

        message.textContent = result.message;
        message.style.color = "#34d399";

        document.getElementById("deviceForm").reset();

        loadDevices();

    } catch (error) {
        message.textContent = error.message;
        message.style.color = "#f87171";
    }
}

    function showToast(message) {
        const toast = document.getElementById("toast");

        toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 4000);
}

async function checkDevice(id) {
    try {
        const response = await fetch(`/api/devices/${id}/check`);
        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Check failed");
        }

        // Update device status
        document.getElementById(`status-${id}`).textContent =
            result.status;

        // Update latency
        document.getElementById(`latency-${id}`).textContent =
            result.latency === null
                ? "--"
                : result.latency + " ms";

        // Show notification if status changed
        if (result.status_changed) {
    showToast(
        `Device ${result.device} changed from ${result.previous_status} to ${result.status}!`
    );
}

    } catch (error) {
        alert(error.message);
    }
}


async function deleteDevice(id) {
    if (!confirm("Are you sure you want to delete this device?")) {
        return;
    }

    try {
        const response = await fetch(`/api/devices/${id}`, {
            method: "DELETE"
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Delete failed");
        }

        loadDevices();

    } catch (error) {
        alert(error.message);
    }
}


function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[character]);
}


document.getElementById("deviceForm")
    .addEventListener("submit", addDevice);

loadDevices().then(() => {
    startAutoMonitoring();
});
</script>

<div id="toast" class="toast"></div>

</body>
</html>
